name: 打包沉浸状态栏版 Jellyfin
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 下载官方源代码（和你手机上的版本一致）
      uses: actions/checkout@v4
      with:
        repository: jellyfin/jellyfin-android
        ref: 9a5f9be6a76da47ca07733b982a12dbd0f75539b
        path: src
    - name: 添加状态栏变色代码
      run: |
        cat > src/app/src/main/java/org/jellyfin/mobile/webapp/SystemBarColorBridge.kt <<'KT'
        package org.jellyfin.mobile.webapp

        import android.app.Activity
        import android.graphics.Bitmap
        import android.graphics.Canvas
        import android.graphics.ColorFilter
        import android.graphics.Paint
        import android.graphics.PixelFormat
        import android.graphics.Rect
        import android.graphics.drawable.Drawable
        import android.os.Build
        import android.os.Handler
        import android.os.Looper
        import android.os.SystemClock
        import android.view.PixelCopy
        import android.view.View
        import android.webkit.JavascriptInterface
        import android.webkit.WebView
        import androidx.annotation.RequiresApi
        import androidx.core.graphics.ColorUtils
        import androidx.core.view.WindowCompat

        /**
         * Paints the status bar / navigation bar area with the colour actually shown on screen
         * right next to them, and switches the system bar icons between light and dark automatically.
         */
        class SystemBarColorBridge(
            private val activity: Activity,
            private val webView: WebView,
        ) {
            private val barBackground = SplitColorDrawable()
            private val handler = Handler(Looper.getMainLooper())
            private var hasColors = false
            private var topColor = 0
            private var bottomColor = 0
            private var sampling = false
            private var samplingSince = 0L

            private val sampler = object : Runnable {
                override fun run() {
                    sampleScreen()
                    handler.postDelayed(this, SAMPLE_INTERVAL_MS)
                }
            }

            init {
                webView.addOnAttachStateChangeListener(object : View.OnAttachStateChangeListener {
                    override fun onViewAttachedToWindow(v: View) {
                        handler.removeCallbacks(sampler)
                        handler.post(sampler)
                    }

                    override fun onViewDetachedFromWindow(v: View) {
                        handler.removeCallbacks(sampler)
                    }
                })
                if (webView.isAttachedToWindow) handler.post(sampler)
            }

            /** Fallback for Android 7 and older, where the screen can't be sampled directly. */
            @JavascriptInterface
            fun setColors(top: Int, bottom: Int) {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) return
                webView.post { apply(top or OPAQUE, bottom or OPAQUE) }
            }

            private fun sampleScreen() {
                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                if (sampling && SystemClock.uptimeMillis() - samplingSince < STUCK_TIMEOUT_MS) return
                if (!webView.isAttachedToWindow || !webView.isShown || !activity.hasWindowFocus()) return
                val w = webView.width
                val h = webView.height
                if (w <= 0 || h <= 4) return
                val loc = IntArray(2)
                webView.getLocationInWindow(loc)
                val x = loc[0]
                val y = loc[1]
                sampling = true
                samplingSince = SystemClock.uptimeMillis()
                copyRow(Rect(x, y + 1, x + w, y + 2)) { top ->
                    copyRow(Rect(x, y + h - 2, x + w, y + h - 1)) { bottom ->
                        sampling = false
                        if (top != null) apply(top, bottom ?: top)
                    }
                }
            }

            @RequiresApi(Build.VERSION_CODES.O)
            private fun copyRow(rect: Rect, callback: (Int?) -> Unit) {
                val bitmap = Bitmap.createBitmap(SAMPLE_COUNT, 1, Bitmap.Config.ARGB_8888)
                try {
                    PixelCopy.request(activity.window, rect, bitmap, { result ->
                        val color = if (result == PixelCopy.SUCCESS) dominantColor(bitmap) else null
                        bitmap.recycle()
                        callback(color)
                    }, handler)
                } catch (e: IllegalArgumentException) {
                    bitmap.recycle()
                    callback(null)
                }
            }

            private fun dominantColor(bitmap: Bitmap): Int {
                val pixels = IntArray(bitmap.width)
                bitmap.getPixels(pixels, 0, bitmap.width, 0, 0, bitmap.width, 1)
                val best = pixels.groupBy { it }.maxByOrNull { it.value.size }?.key ?: pixels[0]
                return best or OPAQUE
            }

            private fun apply(top: Int, bottom: Int) {
                if (!webView.isAttachedToWindow || !webView.isShown) return
                val parent = webView.parent as? View ?: return
                if (parent.background !== barBackground) parent.background = barBackground
                if (hasColors && top == topColor && bottom == bottomColor) return
                hasColors = true
                topColor = top
                bottomColor = bottom
                barBackground.setColors(top, bottom)
                val window = activity.window
                val controller = WindowCompat.getInsetsController(window, window.decorView)
                controller.isAppearanceLightStatusBars = ColorUtils.calculateLuminance(top) > 0.5
                controller.isAppearanceLightNavigationBars = ColorUtils.calculateLuminance(bottom) > 0.5
            }

            private class SplitColorDrawable : Drawable() {
                private val topPaint = Paint()
                private val bottomPaint = Paint()

                fun setColors(top: Int, bottom: Int) {
                    topPaint.color = top
                    bottomPaint.color = bottom
                    invalidateSelf()
                }

                override fun draw(canvas: Canvas) {
                    val b = bounds
                    val mid = b.top + b.height() / 2f
                    canvas.drawRect(b.left.toFloat(), b.top.toFloat(), b.right.toFloat(), mid, topPaint)
                    canvas.drawRect(b.left.toFloat(), mid, b.right.toFloat(), b.bottom.toFloat(), bottomPaint)
                }

                override fun setAlpha(alpha: Int) = Unit

                override fun setColorFilter(colorFilter: ColorFilter?) = Unit

                @Deprecated("Deprecated in Java")
                override fun getOpacity(): Int = PixelFormat.OPAQUE
            }

            companion object {
                private const val SAMPLE_INTERVAL_MS = 300L
                private const val STUCK_TIMEOUT_MS = 2000L
                private const val SAMPLE_COUNT = 32
                private const val OPAQUE = 0xFF000000.toInt()

                const val SCRIPT = """
        (function () {
          if (window.__systemBarsHooked) return;
          window.__systemBarsHooked = true;
          function parse(c) {
            var m = c && c.match(/rgba?\(([^)]+)\)/);
            if (!m) return null;
            var p = m[1].split(',').map(function (s) { return parseFloat(s); });
            var a = p.length > 3 ? p[3] : 1;
            if (!(a > 0.5)) return null;
            return ((p[0] & 255) << 16) | ((p[1] & 255) << 8) | (p[2] & 255);
          }
          function colorAt(y) {
            var x = Math.round(window.innerWidth / 2);
            var list = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
            for (var i = 0; i < list.length; i++) {
              var c = parse(getComputedStyle(list[i]).backgroundColor);
              if (c !== null) return c;
            }
            var fb = parse(getComputedStyle(document.body).backgroundColor);
            if (fb === null) fb = parse(getComputedStyle(document.documentElement).backgroundColor);
            return fb;
          }
          function tick() {
            try {
              var top = colorAt(1);
              var bottom = colorAt(window.innerHeight - 2);
              if (top !== null) NativeSystemBars.setColors(top, bottom !== null ? bottom : top);
            } catch (e) {}
          }
          tick();
          setInterval(tick, 500);
        })();
        """
            }
        }
        KT
    - name: 把新代码接到 App 里
      run: |
        python3 - <<'PY'
        import re, sys
        path = "src/app/src/main/java/org/jellyfin/mobile/webapp/WebViewFragment.kt"
        lines = open(path, encoding="utf-8").read().split("\n")

        def insert(match, new_line, before):
            hits = [i for i, l in enumerate(lines) if l.strip() == match]
            if not hits:
                sys.exit(f"找不到要修改的位置: {match}")
            for i in reversed(hits):
                indent = re.match(r"\s*", lines[i]).group(0)
                lines.insert(i if before else i + 1, indent + new_line)

        insert("settings.applyDefault()",
               'addJavascriptInterface(SystemBarColorBridge(requireActivity(), this), "NativeSystemBars")',
               before=False)
        insert("webView.fadeIn()",
               "webView.evaluateJavascript(SystemBarColorBridge.SCRIPT, null)",
               before=False)
        open(path, "w", encoding="utf-8").write("\n".join(lines))
        print("修改完成")
        PY
    - name: 准备 Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version-file: src/.tools-versions
    - name: 准备 Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: 编译安装包
      working-directory: src
      run: ./gradlew assembleProprietaryDebug
    - name: 收集安装包
      run: |
        mkdir -p out
        find src/app/build/outputs -iname "*.apk" -exec cp "{}" out/ \;
        ls -la out
    - name: 上传安装包
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-沉浸状态栏
        if-no-files-found: error
        path: out/
